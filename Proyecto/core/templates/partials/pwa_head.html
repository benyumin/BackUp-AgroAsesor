{% load static %}
{# Aplicación instalable (PWA): ver core/pwa.py. Se incluye desde partials/access_head.html y body.html. #}
<meta name="theme-color" content="#0b6b4b">
<meta name="application-name" content="AgroAsesor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AgroAsesor">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="{% url 'pwa_manifest' %}">
<link rel="icon" type="image/png" sizes="32x32" href="{% static 'pwa/favicon-32.png' %}">
<link rel="apple-touch-icon" href="{% static 'pwa/apple-touch-icon.png' %}">
{# Pantalla de inicio de iPhone (vertical). Android la arma sola con el nombre, el color de fondo y el ícono del manifest. #}

      href="{% static 'pwa/splash/iphone-750x1334.png' %}"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)">
